<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunrise Cinema · CSE205 Unit I</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><circle cx="16" cy="20" r="8" fill="#F4B740"/><rect x="2" y="20" width="28" height="10" fill="var(--paper)"/><path d="M4 21h24" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <div>
        <div class="brand-name">Sunrise Cinema</div>
        <div class="brand-sub">CSE205 Unit I · one booking system, the whole unit</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="mode-badge" class="mode-badge">connecting…</span>
      <button id="reset-button" class="button ghost" type="button">Reset data</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="stage-nav" aria-label="Stages"></nav>
    <main class="content">
      <div id="server-warning" class="server-warning" hidden>
        Cannot reach the C++ server. Start it from the project folder with <code>make run</code>, then refresh this page.
      </div>
      <section id="stage-view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
